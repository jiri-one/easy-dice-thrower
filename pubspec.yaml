name: easy_dice_thrower
description: A configurable dice tray for e-ink screens, with numeric and custom dice.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dice_thrower:
    git:
      url: https://github.com/jiri-one/dice_thrower
      ref: ee066170635943e08643c480aef9767fef0c0de2
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.9
  intl: ^0.20.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/mercenary/
