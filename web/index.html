<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your dice, your game. Numeric dice, mercenary swords and custom trays for e-ink screens.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Easy Dice">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Easy Dice Thrower</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: white; color: black; }
    #loading { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; font: 18px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading" role="status">Easy Dice Thrower…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>

</html>
